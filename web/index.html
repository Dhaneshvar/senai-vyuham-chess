    <style>
      #startup-loader { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #1d3324, #101512 68%); color: #f8f3e9; opacity: 0; visibility: hidden; pointer-events: none; animation: reveal-loader .16s ease 700ms forwards; }
      #startup-loader > div { display: grid; justify-items: center; gap: 12px; text-align: center; }
      #startup-loader img { width: 82px; height: 82px; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(184,243,106,.3)); animation: crest-pulse 1.15s ease-in-out infinite alternate; }
      #startup-loader strong { font: 900 16px Georgia, serif; letter-spacing: 2px; }
      #startup-loader span { color: #c8d8c9; font: 12px system-ui, sans-serif; }
      #startup-loader i { width: 132px; height: 3px; overflow: hidden; border-radius: 99px; background: #2c4431; }
      #startup-loader i::after { content: ''; display: block; width: 45%; height: 100%; border-radius: inherit; background: #b8f36a; animation: loader-sweep .9s ease-in-out infinite; }
      .app-ready #startup-loader { opacity: 0; visibility: hidden; animation: none; transition: opacity .16s ease, visibility 0s linear .16s; }
      @keyframes reveal-loader { to { opacity: 1; visibility: visible; } }
      @keyframes crest-pulse { to { transform: translateY(-3px) scale(1.04); } }
      @keyframes loader-sweep { from { transform: translateX(-120%); } to { transform: translateX(270%); } }
      @media (prefers-reduced-motion: reduce) { #startup-loader, #startup-loader img, #startup-loader i::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="startup-loader" role="status" aria-live="polite"><div><img src="/vyuha-chess-ai-logo.webp" width="82" height="82" alt="Senai Vyuham logo" title="Senai Vyuham" /><strong>SENAI VYUHAM</strong><span>Preparing your board…</span><i aria-hidden="true"></i></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
